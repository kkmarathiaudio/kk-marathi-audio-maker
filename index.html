<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.K. Marathi Audio Maker</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px;color:#222}
.container{max-width:600px;margin:25px auto;background:white;padding:24px;border-radius:18px;box-shadow:0 3px 15px #ddd}
h1{text-align:center;color:#6b21a8}
p{text-align:center;color:#555}
textarea{width:100%;height:220px;padding:12px;box-sizing:border-box;border:1px solid #bbb;border-radius:10px;font-size:17px}
button{width:100%;padding:15px;margin-top:15px;background:#6b21a8;color:white;border:0;border-radius:10px;font-size:18px}
audio{width:100%;margin-top:20px}
.note{font-size:13px;color:#777}
</style>
</head>
<body>
<div class="container">
<h1>🎙️ K.K. Marathi Audio Maker</h1>
<p>मराठी मजकूर थेट आवाजात रूपांतरित करा</p>
<textarea id="text" placeholder="येथे आपला मराठी मजकूर लिहा किंवा पेस्ट करा..."></textarea>
<button id="make" onclick="makeAudio()">ऑडिओ तयार करा</button>
<p id="status"></p>
<audio id="player" controls style="display:none"></audio>
<p class="note">मराठी आवाजासाठी निश्चित केलेली सेटिंग वापरली जाईल.</p>
</div>
<script>
async function makeAudio(){
 const text=document.getElementById('text').value.trim();
 const status=document.getElementById('status');
 if(!text){status.textContent='कृपया आधी मजकूर टाका.';return;}
 status.textContent='ऑडिओ तयार होत आहे...';
 try{
  const response=await fetch('/api/tts',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({text})
  });
  if(!response.ok){
  const err = await response.json();
  throw new Error(err.error || err.message || 'सर्व्हर त्रुटी');
  }
  const blob=await response.blob();
  const url=URL.createObjectURL(blob);
  const player=document.getElementById('player');
  player.src=url;
  player.style.display='block';
  status.textContent='ऑडिओ तयार झाला!';
 }catch(error){
  status.textContent='त्रुटी: '+error.message;
  
 }
}
</script>
</body>
</html>
